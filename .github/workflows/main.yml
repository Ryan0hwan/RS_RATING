name: RS Dashboard

on:
  schedule:
    # 하루 1회, 미국 장 마감 후 (UTC 21:50 = 한국 06:50)
    - cron: "50 21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "주말에도 실행 (최근 거래일 기준)"
        type: boolean
        default: true

permissions:
  contents: write        # 계산 결과(docs, data)를 저장소에 저장하기 위해 필요

concurrency:
  group: rs-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python rs.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE: ${{ inputs.force && '1' || '0' }}

      # 대시보드와 순위 기록을 저장소에 저장 → GitHub Pages가 자동으로 새 페이지를 게시
      - name: Save results
        run: |
          git config user.name "rs-dashboard-bot"
          git config user.email "rs-dashboard-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "RS update $(date -u +%F)"
          git push
